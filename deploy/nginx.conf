server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. Resolving per request (via the variable below) lets
  # nginx follow TravStats when its container is recreated, and keeps nginx
  # from crash-looping if travstats-app is down at boot.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same origin as the app, so TravStats' host-only SameSite=Strict cookie works.
  location /api/v1/ {
    set $travstats http://travstats-app:80;
    proxy_pass $travstats;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
